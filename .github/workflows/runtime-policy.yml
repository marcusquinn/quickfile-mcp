name: Runtime Policy

on:
  pull_request:
    paths:
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-runtime-policy.cjs"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  verify-runtime-policy:
    name: Verify Runtime Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check runtime policy
        run: npm run check:runtime
