name: Publish npm

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions: {}

jobs:
  publish:
    name: Publish package
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout released commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Use trusted-publishing-compatible npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: |
          npm run check:runtime
          npm run check:rest
          npm run lint -- --max-warnings=0
          npm run typecheck
          npm test -- --runInBand
          npm run build
          npm run secretlint

      - name: Verify tag and package metadata
        id: package
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node --print "require('./package.json').version")
          PACKAGE_NAME=$(node --print "require('./package.json').name")
          FILE_VERSION=$(tr -d '\r\n' < VERSION)
          TAG="v${VERSION}"

          test "$VERSION" = "$FILE_VERSION"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          test "$TAG_SHA" = "$RELEASE_SHA"

          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check registry version
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.registry.outputs.exists == 'false'
        run: npm publish

      - name: Publication summary
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          VERSION_EXISTS: ${{ steps.registry.outputs.exists }}
        run: |
          echo "## npm publication" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: ${PACKAGE_NAME}@${PACKAGE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Already published: ${VERSION_EXISTS}" >> "$GITHUB_STEP_SUMMARY"
